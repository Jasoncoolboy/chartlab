<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__</title>
<style>
:root{--bg:#0e1117;--panel:#131722;--panel2:#1e222d;--border:#2a2e39;--text:#d1d4dc;--muted:#787b86;--up:#26a69a;--down:#ef5350;--acc:#2962ff}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden;display:flex;flex-direction:column}
#app{display:flex;flex-direction:column;height:100vh}
header.tb{flex:0 0 auto;background:var(--panel);border-bottom:1px solid var(--border);user-select:none}
.tbrow{display:flex;align-items:center;gap:10px;padding:5px 10px;min-height:40px}
.tbrow+.tbrow{border-top:1px solid var(--border)}
.brand{display:flex;align-items:center;gap:8px;font-weight:600}
.brand .lg{width:20px;height:20px;background:var(--acc);border-radius:4px;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;flex:0 0 auto}
.brand .sy{font-size:15px;letter-spacing:.3px}
.brand .ex{color:var(--muted);font-size:11px;font-weight:400}
.sep{width:1px;height:22px;background:var(--border);flex:0 0 auto}
button.tb{background:transparent;border:1px solid transparent;color:var(--text);font-size:12px;padding:4px 10px;border-radius:4px;cursor:pointer;white-space:nowrap;font-family:inherit}
button.tb:hover{background:var(--panel2)}
button.tb.on{background:var(--acc);color:#fff;border-color:var(--acc)}
button.tb.active{background:var(--panel2);border-color:var(--acc);color:#fff}
label.chk{display:flex;align-items:center;gap:6px;color:var(--muted);cursor:pointer;white-space:nowrap;font-size:12px}
input[type=checkbox]{accent-color:var(--acc)}
.flex{flex:1}
#chartWrap{position:relative;flex:1 1 100%;min-height:0;background:var(--panel)}
#eqWrap{position:relative;flex:0 0 170px;min-height:0;border-top:1px solid var(--border);background:#0e1117;display:flex;flex-direction:column}
#eqWrap.hide{display:none}
#eqTitle{flex:0 0 auto;font-size:11px;color:var(--muted);padding:2px 10px 0;user-select:none}
#eqC{flex:1;position:relative}
#chart,#eqC>div{width:100%;height:100%}
#overlay{position:absolute;inset:0;pointer-events:none;z-index:5}
#overlay.drawing{pointer-events:auto;cursor:crosshair}
#legend{position:absolute;left:10px;top:8px;z-index:6;pointer-events:none;font-size:11px;line-height:1.55}
#legend .l1{font-size:12px;font-weight:600}
#legend .l1 .s2{color:var(--muted);font-weight:400;margin-left:5px}
#legend .l1 .tf{color:var(--acc);margin-left:10px}
#legend .vals span{margin-right:12px;display:inline-block}
#legend .vals .o{color:var(--muted)}
#legend .vals .h{color:var(--down)}
#legend .vals .l{color:var(--up)}
#legend .vals .c.up{color:var(--up)}
#legend .vals .c.dn{color:var(--down)}
#legend .vals .ch{color:var(--muted)}
.chips{display:flex;gap:5px;flex-wrap:wrap;max-width:420px}
.chip{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.07);padding:1px 8px;border-radius:10px;font-size:11px;white-space:nowrap;cursor:pointer;border:1px solid transparent}
.chip i{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.chip.off{opacity:.45;border-color:var(--border)}
footer.st{flex:0 0 auto;height:26px;background:var(--panel);border-top:1px solid var(--border);display:flex;align-items:center;padding:0 10px;font-size:11px;color:var(--muted);gap:16px;user-select:none;overflow:hidden;white-space:nowrap}
footer.st b{color:var(--text);font-weight:500}
.lblpos{color:var(--muted);font-size:11px}
#stats{position:absolute;right:10px;top:8px;z-index:6;background:rgba(19,23,34,.88);border:1px solid var(--border);border-radius:6px;padding:7px 10px;font-size:11px;pointer-events:none;min-width:160px}
#stats.hide{display:none}
#stats .h{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.4px;margin-bottom:4px}
#stats .r{display:flex;justify-content:space-between;gap:18px;line-height:1.65}
#stats .r .k{color:var(--muted)}
#stats .r .v{font-weight:600;font-variant-numeric:tabular-nums}
#stats .v.up{color:var(--up)}#stats .v.down{color:var(--down)}
#chartWrap.drawerOpen #stats{right:382px}
#drawer{position:absolute;right:0;top:0;bottom:0;width:370px;max-width:82%;background:rgba(19,23,34,.97);border-left:1px solid var(--border);z-index:9;display:flex;flex-direction:column}
#drawer.hide{display:none}
#drawer .dh{flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--border);font-size:12px;font-weight:600}
#drawer .dx{background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;padding:0 4px}
#drawer .dx:hover{color:var(--text)}
#drawerBody{flex:1 1 auto;overflow:auto;font-size:11px}
#drawerBody .tr{display:flex;gap:8px;align-items:center;padding:5px 10px;border-bottom:1px solid rgba(42,46,57,.5);cursor:pointer;white-space:nowrap}
#drawerBody .tr:hover{background:rgba(255,255,255,.04)}
#drawerBody .tr .d{font-weight:700;width:12px;flex:0 0 auto}
#drawerBody .tr .d.up{color:var(--up)}#drawerBody .tr .d.down{color:var(--down)}
#drawerBody .tr .tm{color:var(--muted);width:112px;flex:0 0 auto}
#drawerBody .tr .px{flex:1 1 auto;font-variant-numeric:tabular-nums}
#drawerBody .tr .nt{font-variant-numeric:tabular-nums;flex:0 0 auto}
#drawerBody .tr .nt.up{color:var(--up)}#drawerBody .tr .nt.down{color:var(--down)}
#drawerBody .more,#drawerBody .empty{padding:10px;color:var(--muted)}
@media print{body{overflow:visible}header.tb,footer.st,#drawer{display:none!important}#app{height:auto}#chartWrap{height:80vh}}
</style>
</head>
<body>
<div id="app">
<header class="tb">
  <div class="tbrow">
    <div class="brand"><div class="lg">CL</div><div><div class="sy" id="syTitle">Chart</div><div class="ex" id="exSub"></div></div></div>
    <div class="sep"></div>
    <label class="chk"><input type="checkbox" id="ckZones" checked>Zones</label>
    <label class="chk"><input type="checkbox" id="ckTrades" checked>Trades</label>
    <label class="chk" id="lblVol" style="display:none"><input type="checkbox" id="ckVol" checked>Volume</label>
    <label class="chk"><input type="checkbox" id="ckEq">Equity</label>
    <label class="chk" id="lblStats" style="display:none"><input type="checkbox" id="ckStats" checked>Metrics</label>
    <button class="tb" id="btnTrades" style="display:none">Trades</button>
    <div class="flex"></div>
    <button class="tb" data-r="1m">1M</button>
    <button class="tb" data-r="3m">3M</button>
    <button class="tb" data-r="6m">6M</button>
    <button class="tb" data-r="1y">1Y</button>
    <button class="tb" data-r="all">All</button>
    <div class="sep"></div>
    <span class="lblpos" title="Chart data is always UTC; this only changes how times are displayed">Time</span>
    <button class="tb" data-tz="MYT" title="Malaysian time, UTC+8">MYT</button>
    <button class="tb" data-tz="UTC" title="UTC">UTC</button>
    <div class="sep"></div>
    <button class="tb" id="btnFit">Fit</button>
    <button class="tb" id="btnClearDrw">Clear drawings</button>
  </div>
  <div class="tbrow">
    <div style="display:flex;gap:4px;flex-wrap:wrap;align-items:center" id="tfBtns"></div>
    <div class="sep"></div>
    <div style="display:flex;gap:4px;align-items:center" id="drawTools">
      <button class="tb active" data-tool="hand">Hand</button>
      <button class="tb" data-tool="rect">Rectangle</button>
      <button class="tb" data-tool="hline">Horizontal line</button>
    </div>
    <div class="flex"></div>
    <div class="chips" id="indChips"></div>
    <span class="lblpos" id="hint">Hand: drag=pan · scroll=zoom · dbl-click=fit</span>
  </div>
</header>
<div id="chartWrap">
  <div id="chart"></div>
  <canvas id="overlay"></canvas>
  <div id="legend"></div>
  <div id="stats" class="hide"></div>
  <div id="drawer" class="hide">
    <div class="dh"><span id="drawerTitle">Trades</span><span class="flex"></span><button class="dx" id="drawerClose">&times;</button></div>
    <div id="drawerBody"></div>
  </div>
</div>
<div id="eqWrap" class="hide">
  <div id="eqTitle">Equity curve</div>
  <div id="eqC"></div>
</div>
<footer class="st">
  <span>Bar: <b id="stT">—</b> <b id="stP">—</b></span>
  <span id="stD">—</span>
  <span class="flex"></span>
  <span id="stFt">offline</span>
</footer>
</div>
<script src="__LIB__"></script>
<script id="payload" type="application/json">__DATA__</script>
<script>
(function(){
"use strict";
var PAY={},SYM="Chart",TFS={},TRADES=[],ZONES=[],EQ=null,INDS={},STATS=[],defTF="D1",PREC=2;
var TZS={"UTC":0,"MYT":28800},TZLABEL={"UTC":"UTC","MYT":"MYT (UTC+8)"},TZNAME="UTC",OFF=0;
var SPEC_URL=__SPEC_URL__;
var candleCache={},indCalcCache={},drawerRendered=0,hoverTrade=null;
var PAL=["#2962ff","#e91e63","#7b1fa2","#00897b","#f4511e","#c0ca33","#5e35b1","#00acc1"];
var chart,series,volumeSeries,eqChart,eqSeries,canvas,ctx;
var curTF=null,drawings=[],drawMode=null,drawBuf=null,dpr=1,indSeries=[];
function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function b64bytes(v){var bin=atob(v||""),n=bin.length,u=new Uint8Array(n);for(var i=0;i<n;i++)u[i]=bin.charCodeAt(i);return u}
function decInts(v,signed){

function decodeBlock(b){
  if(!b||!b.t)return b;
  var o={time:decInts(b.t,false)},pairs=[["o","open"],["h","high"],["l","low"],["c","close"]];
  var sc=b.s||1e4;
  pairs.forEach(function(pr){if(b[pr[0]]!=null){var a=decInts(b[pr[0]],true);for(var i=0;i<a.length;i++)a[i]=a[i]/sc;o[pr[1]]=a}});
  if(b.v)o.volume=b.v;

}
function inferPrec(){
  var need=2,k,c,i,a,v,tol;
  for(k in TFS){
    var d=TFS[k];if(!d)continue;
    var cols=[d.open,d.high,d.low,d.close];

      a=cols[c]||[];
      for(i=0;i<a.length;i++){
        v=a[i];if(v===null||v===undefined||!isFinite(v))continue;

        if(need>=8)return 8;

  }

function fp(x){return Number(x).toFixed(PREC)}

function shiftTimes(d){
  if(!d)return;
  var k,i,a;
  for(k in TFS){a=TFS[k].time;for(i=0;i<a.length;i++)a[i]+=d}
  TRADES.forEach(function(t){t.entryTime+=d;if(t.exitTime!==undefined&&t.exitTime!==null)t.exitTime+=d});
  ZONES.forEach(function(z){z.start+=d;z.end+=d});
  if(EQ)EQ.forEach(function(e){e.time+=d});
  drawings.forEach(function(g){if(g.t1!=null)g.t1+=d;if(g.t2!=null)g.t2+=d});
  candleCache={};
}
function setTZName(name){
  if(!TZS.hasOwnProperty(name))name="MYT";
  shiftTimes(TZS[name]-OFF);OFF=TZS[name];TZNAME=name;
}
function initTZ(){
  var q=null,st=null;
  try{q=new URLSearchParams(location.search).get("tz")}catch(e){}
  try{st=window.localStorage.getItem("chartlab.tz")}catch(e){}
  var c=[q,st,PAY.tz,"MYT"];
  for(var i=0;i<c.length;i++){var u=c[i]&&String(c[i]).toUpperCase();if(u&&TZS.hasOwnProperty(u))return u}
  return "MYT";
}
function paintTZ(){
  var b=document.querySelectorAll("[data-tz]");
  for(var i=0;i<b.length;i++)b[i].classList.toggle("on",b[i].dataset.tz===TZNAME);
  $("exSub").textContent=[PAY.exchange,PAY.periodLabel,TZLABEL[TZNAME]].filter(Boolean).join(" · ");
  $("stFt").textContent=[PAY.exchange||"offline",TZLABEL[TZNAME],"offline"].join(" · ");
}
function switchTZ(name){
  if(name===TZNAME||!TZS.hasOwnProperty(name))return;
  var vr=null;try{vr=chart.timeScale().getVisibleRange()}catch(e){}
  var d=TZS[name]-OFF;
  setTZName(name);
  try{window.localStorage.setItem("chartlab.tz",name)}catch(e){}
  setTF(curTF);
  if(eqSeries)eqSeries.setData(EQ);
  if(vr){try{chart.timeScale().setVisibleRange({from:vr.from+d,to:vr.to+d})}catch(e){}}
  drawerRendered=0;$("drawerBody").innerHTML="";
  if(!$("drawer").classList.contains("hide"))renderDrawerChunk();
  paintTZ();defaultLegend();redraw();
}
function usePayload(p){
  PAY=p||{};SYM=PAY.symbol||"Chart";
  TFS={};var tfs=PAY.timeframes||{},k;
  for(k in tfs)if(Object.prototype.hasOwnProperty.call(tfs,k))TFS[k]=decodeBlock(tfs[k])||tfs[k];
  TRADES=(PAY.overlay&&PAY.overlay.trades)||[];
  ZONES=(PAY.overlay&&PAY.overlay.zones)||[];
  EQ=(PAY.equity&&PAY.equity.time&&PAY.equity.time.length)?PAY.equity.time.map(function(tt,i){return {time:tt,value:PAY.equity.value[i]}}):null;
  INDS=PAY.indicators||{};
  STATS=PAY.stats||[];
  defTF=PAY.defaultTimeframe||Object.keys(TFS)[0]||"D1";
  PREC=(typeof PAY.precision==="number"&&PAY.precision>=0&&PAY.precision<=8)?Math.floor(PAY.precision):inferPrec();

function p2(n){return n<10?"0"+n:""+n}
function fmtT(t){
  if(t===null||t===undefined)return "—";
  var d=new Date(t*1000);
  return d.getUTCFullYear()+"-"+p2(d.getUTCMonth()+1)+"-"+p2(d.getUTCDate())+" "+p2(d.getUTCHours())+":"+p2(d.getUTCMinutes());
}
function hexA(h,a){
  var raw=String(h||"#2962ff").trim();
  if(raw.charAt(0)!=="#")return raw;
  h=raw.slice(1);
  if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
  if(!/^[0-9a-f]{6}$/i.test(h))return raw;
  var r=parseInt(h.substr(0,2),16),g=parseInt(h.substr(2,2),16),b=parseInt(h.substr(4,2),16);
  return "rgba("+r+","+g+","+b+","+a+")";
}
function init(){

    autoSize:false,
    layout:{background:{type:"solid",color:"#131722"},textColor:"#d1d4dc",fontFamily:'-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif',fontSize:11},
    grid:{vertLines:{color:"#1e222d"},horzLines:{color:"#1e222d"}},
    rightPriceScale:{borderColor:"#2a2e39",scaleMargins:{top:0.06,bottom:0.06}},
    timeScale:{borderColor:"#2a2e39",timeVisible:true,secondsVisible:false,rightOffset:5,barSpacing:7,minBarSpacing:0.01,fixRightEdge:true},
    crosshair:{mode:1,vertLine:{color:"#758696",width:1,style:3,labelBackgroundColor:"#363c4e"},horzLine:{color:"#758696",width:1,style:3,labelBackgroundColor:"#363c4e"}},
    handleScroll:{mouseWheel:true,pressedMouseMove:true,horzTouchDrag:true,vertTouchDrag:true},
    handleScale:{mouseWheel:true,pinch:true,axisPressedMouseMove:true},
    localization:{timeFormatter:function(t){return fmtT(t)}}
  });
  $("syTitle").textContent=SYM;
  paintTZ();
  $("lblStats").style.display=STATS.length?"":"none";
  renderStats();
  $("btnTrades").style.display=TRADES.length?"":"none";
  if(EQ){
    eqChart=LightweightCharts.createChart($("eqC"),{autoSize:false,layout:{background:{type:"solid",color:"#0e1117"},textColor:"#787b86",fontSize:10},grid:{vertLines:{visible:false},horzLines:{color:"#1e222d"}},rightPriceScale:{borderColor:"#2a2e39"},timeScale:{visible:false},crosshair:{mode:0}});
    eqSeries=eqChart.addAreaSeries({lineColor:"#2962ff",topColor:"rgba(41,98,255,0.22)",bottomColor:"rgba(41,98,255,0)",lineWidth:2,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
    eqSeries.setData(EQ);
    eqChart.timeScale().fitContent();
    $("ckEq").onchange=function(){
      var on=$("ckEq").checked;
      $("eqWrap").classList.toggle("hide",!on);
      if(on)eqChart.timeScale().fitContent();
    };
  }else{$("ckEq").closest("label").style.display="none"}
  canvas=$("overlay");ctx=canvas.getContext("2d");
  buildTF();
  bindUI();
  chart.subscribeCrosshairMove(onCrosshair);
  chart.timeScale().subscribeVisibleLogicalRangeChange(onRange);
  setTF(defTF);
  function covered(){
    try{
      var vr=chart.timeScale().getVisibleRange();
      var t=TFS[curTF].time;
      return !!(vr&&t.length&&vr.from<=t[0]&&vr.to>=t[t.length-1]);
    }catch(e){return false}
  }
  var fitUntil=Date.now()+5000,fitTimer=null;

  }

}
function buildTF(){
  var el=$("tfBtns");el.innerHTML="";
  Object.keys(TFS).forEach(function(tf){
    var b=document.createElement("button");b.className="tb";b.textContent=tf;
    b.onclick=function(){setTF(tf)};
    el.appendChild(b);
  });
}
function candleData(tf){
  if(candleCache[tf])return candleCache[tf];
  var d=TFS[tf];
  var out=new Array(d.time.length);
  for(var i=0;i<d.time.length;i++)out[i]={time:d.time[i],open:d.open[i],high:d.high[i],low:d.low[i],close:d.close[i]};

}
function volumeData(tf){
  var d=TFS[tf];if(!d||!d.volume)return null;

  for(var i=0;i<d.time.length;i++)out[i]={time:d.time[i],value:d.volume[i],

function setTF(tf){

  var btns=$("tfBtns").children;
  for(var i=0;i<btns.length;i++)btns[i].classList.toggle("on",btns[i].textContent===tf);
  if(series)chart.removeSeries(series);
  if(volumeSeries){chart.removeSeries(volumeSeries);volumeSeries=null;}
  series=chart.addCandlestickSeries({
    upColor:"#26a69a",downColor:"#ef5350",borderUpColor:"#26a69a",borderDownColor:"#ef5350",wickUpColor:"#26a69a",wickDownColor:"#ef5350",

function sma(a,n){var s=0,o=new Array(a.length);for(var i=0;i<a.length;i++){s+=a[i];if(i>=n)s-=a[i-n];o[i]=(i>=n-1)?s/n:null;}return o}
function ema(a,n){var k=2/(n+1),p=null,o=new Array(a.length);for(var i=0;i<a.length;i++){p=(p===null)?a[i]:a[i]*k+p*(1-k);o[i]=p;}return o}
function boll(a,n){var m=sma(a,n),o=new Array(a.length);for(var i=0;i<a.length;i++){if(m[i]===null){o[i]=null;continue}var s=0;for(var j=i-n+1;j<=i;j++)s+=(a[j]-m[i])*(a[j]-m[i]);o[i]=Math.sqrt(s/n);}return {m:m,u:m.map(function(x,i){return x===null?null:x+2*o[i]}),lo:m.map(function(x,i){return x===null?null:x-2*o[i]})}}
function rsi(a,n){
  n=n||14;var out=new Array(a.length),g=0,l=0;
  for(var i=0;i<a.length;i++){
    out[i]=null;

      g+=up;l+=dn;

}
function setHover(i){
  hoverTrade=(i===null||i===undefined)?null:TRADES[i];
  redraw();
}
function focusTrade(i){
  var tr=TRADES[i];if(!tr)return;
  var from=tr.entryTime,to=(tr.exitTime!==undefined&&tr.exitTime!==null)?tr.exitTime:tr.entryTime;
  if(to<from){var x=from;from=to;to=x}
  var pad=Math.max(3600,(to-from)*0.2);
  chart.timeScale().setVisibleRange({from:from-pad,to:to+pad});
  redraw();
}
function toggleDrawer(force){
  var el=$("drawer");
  var open=(force===undefined)?el.classList.contains("hide"):!!force;
  el.classList.toggle("hide",!open);
  $("chartWrap").classList.toggle("drawerOpen",open);
  if(open){
    $("drawerTitle").textContent="Trades ("+TRADES.length+")";
    if(drawerRendered===0)renderDrawerChunk();
    requestAnimationFrame(fitCanvas);
  }else setHover(null);
}
function startLoader(){
  if(typeof LightweightCharts==="undefined"){
    document.body.innerHTML="<p style='padding:20px;color:#ef5350'>Chart library failed to load (assets/lightweight-charts.standalone.production.js).</p>";
    return;
  }
  var inline=(document.getElementById("payload").textContent||"").trim();
  var url=SPEC_URL;
  try{var q=new URLSearchParams(location.search).get("spec");if(q)url=q;}catch(e){}
  if(inline&&inline!=="null"&&inline!=="undefined"){
    try{usePayload(JSON.parse(inline))}catch(e){usePayload(null)}
    init();return;
  }
  if(url){
    fetch(url,{cache:"no-cache"}).then(function(r){
      if(!r.ok)throw new Error("HTTP "+r.status);
      return r.json();
    }).then(function(j){usePayload(j);init()}).catch(function(e){
      document.body.innerHTML="<p style='padding:20px;color:#ef5350'>Failed to load spec from "+esc(url)+": "+esc(String((e&&e.message)||e))+"</p>";
    });
    return;
  }
  document.body.innerHTML="<p style='padding:20px;color:#ef5350'>No chart data found (inline payload missing and no spec URL).</p>";
}
function boot(){startLoader()}
function debug(){
  if(!series)return {ready:false};
  var vr=chart.timeScale().getVisibleRange();
  var defs=INDS[curTF]||[];
  return {
    ready:true,zones:ZONES.length,trades:TRADES.length,
    zonesOn:$("ckZones").checked,drawings:drawings.length,
    drawingList:drawings.map(function(d){return d;}),
    inds:defs.length,
    indsOn:defs.filter(function(d){return d.on!==false}).length,
    volume:!!volumeSeries,volumeOn:volumeSeries?$("ckVol").checked:false,
    eqOn:!$("eqWrap").classList.contains("hide"),
    stats:STATS.length,statsOn:!$("stats").classList.contains("hide"),
    drawerOpen:!$("drawer").classList.contains("hide"),drawerRows:drawerRendered,
    tf:curTF,tz:TZNAME,tzOffset:OFF,precision:PREC,first:TFS[curTF].time[0],last:TFS[curTF].time[TFS[curTF].time.length-1],
    bars:TFS[curTF].time.length,visible:vr?{from:vr.from,to:vr.to}:null
  };
}
window.ChartLab={debug:debug};
window.__chartDebug=debug;
boot();
})();
</script>
